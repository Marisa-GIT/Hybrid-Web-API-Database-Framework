name: QA Hybrid_Framework CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: DB_ROOT_PASSWORD
          MYSQL_DATABASE: DB_NAME
          MYSQL_USER: DB_USER
          MYSQL_PASSWORD: DB_PASSWORD
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-rerunfailures allure-pytest

      - name: Install MySQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Install Microsoft Edge
        uses: browser-actions/setup-edge@v1

      - name: Initialize Database and Tables
        env:
          MYSQL_PWD: api_validator_2026
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pDB_ROOT_PASSWORD < database/scripts/001_create_database.sql
          mysql -h 127.0.0.1 -P 3306 -u DB_USER -pDB_PASSWORD DB_NAME < database/scripts/002_create_tables.sql
          mysql -h 127.0.0.1 -P 3306 -u DB_USER -pDB_PASSWORD DB_NAME < database/scripts/003_seed_data.sql

      - name: Run tests
        env:
          CI: true
          BROWSER: edge
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: DB_USER
          DB_PASSWORD: DB_PASSWORD
          DB_NAME: DB_NAME
        run: |
          pytest --reruns 2 --alluredir=allure-results

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-screenshots
          path: screenshots/

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-logs
          path: logs/

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
